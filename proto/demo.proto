// The demo services that `raygrpc serve` exposes (also over server reflection).
syntax = "proto3";

package raygrpc.demo;

import "common.proto";

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

// Every scalar type, packed and unpacked repeated fields, nested messages, maps, a oneof
// and a proto3 optional: the codec's torture message.
message Everything {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  raygrpc.common.Level level = 16;
  raygrpc.common.Point point = 17;
  repeated int32 packed_ints = 18;
  repeated sint64 packed_sints = 19;
  repeated double packed_doubles = 20;
  repeated fixed32 unpacked_fixed = 21 [packed = false];
  repeated string names = 22;
  repeated raygrpc.common.Point path = 23;
  map<string, int64> counters = 24;
  map<int32, raygrpc.common.Point> points_by_id = 25;
  oneof choice {
    string text = 26;
    raygrpc.common.Point at = 27;
    Nested nested_choice = 28;
  }
  optional int32 maybe = 29;
  Nested nested = 30;

  message Nested {
    string label = 1;
    Inner inner = 2;
    Mode mode = 3;

    message Inner {
      repeated bool flags = 1;
    }

    enum Mode {
      MODE_UNSPECIFIED = 0;
      FAST = 1;
      SAFE = 2;
    }
  }
}

message EchoRequest {
  string message = 1;
  // A gRPC status code to answer with instead of OK.
  int32 code = 2;
  // How long to wait before answering (deadline tests).
  int32 delay_ms = 3;
  Everything payload = 4;
}

message EchoReply {
  string message = 1;
  // The request metadata the server saw.
  map<string, string> metadata = 2;
  Everything payload = 3;
  // The milliseconds left until the call's deadline (0 = none).
  int64 deadline_ms = 4;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutReply {
  bool created = 1;
}

message KeyRequest {
  string key = 1;
}

message GetReply {
  bytes value = 1;
}

message ListRequest {
  string prefix = 1;
}

message ListReply {
  repeated string keys = 1;
}

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
}

service Echo {
  // Echoes the message; `code` turns it into an error, `delay_ms` into a slow call.
  rpc Echo(EchoRequest) returns (EchoReply);
  // Decodes and re-encodes the message through the schema-driven codec.
  rpc Roundtrip(Everything) returns (Everything);
}

service KeyValue {
  rpc Put(PutRequest) returns (PutReply);
  rpc Get(KeyRequest) returns (GetReply);
  rpc Delete(KeyRequest) returns (PutReply);
  rpc List(ListRequest) returns (ListReply);
}
